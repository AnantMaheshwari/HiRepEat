# Build the HiRepEat image
name: container

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (add linux/arm64 for a multi-arch build; much slower under QEMU)'
        default: 'linux/amd64'
        required: false
      tag:
        description: 'Image tag for a manual build'
        default: 'dev'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${owner}/hirepeat" >> "$GITHUB_ENV"
          echo "Image: ${{ env.REGISTRY }}/${owner}/hirepeat"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.ref_type != 'tag' }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            HIREPEAT_VERSION=${{ steps.version.outputs.value }}
          # Layer cache, which matters a great deal under QEMU.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record what was built
        run: |
          {
            echo "## HiRepEat image"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`${{ steps.version.outputs.value }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| platforms | \`${{ inputs.platforms || 'linux/amd64' }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "### Pull as a SIF"
            echo
            echo '```bash'
            echo "singularity build HiRepEat.sif \\"
            echo "  docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "### Pinned tool versions"
            echo
            echo '```'
            docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
              --format '{{ range $k, $v := .Image.Config.Labels }}{{ $k }}={{ $v }}
          {{ end }}' 2>/dev/null | grep -E '^io\.hirepeat\.' || echo '(labels unavailable)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
